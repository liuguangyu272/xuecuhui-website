<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动报名管理</title>
<style>body{font:15px/1.7 system-ui;margin:30px;color:#233d36;background:#f5f8f6}main{max-width:1150px;margin:auto;background:white;padding:26px;border-radius:16px}button{padding:10px 16px;margin:5px;border:1px solid #abc0b5;border-radius:8px;background:#edf5ef;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #dbe6df;padding:8px;white-space:pre-wrap;text-align:left}.scroll{overflow:auto}#message{white-space:pre-wrap}input{margin:12px}</style>
<main><h1>活动报名管理</h1><p id="title"></p><p>报名记录仅保存在服务器。导入支持 .xlsx，首行列名与报名字段名称对应；学号或完全相同的导入记录会去重。整批校验通过后才入库。</p>
<button id="refresh">刷新名单</button><button id="export">导出名单 / 下载字段模板</button><input id="file" type="file" accept=".xlsx"><button id="import">导入 Excel</button><p id="message" role="status"></p><div class="scroll"><table id="table"></table></div></main>
<script>
const activity=new URLSearchParams(location.search).get('activity');let record;
const $=id=>document.getElementById(id);const text=v=>String(v??'');
async function call(action,extra={}){const r=await fetch('api/registrations/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activity,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'操作失败');return j;}
async function load(){try{const d=await (await fetch('/api/data',{cache:'no-store'})).json();record=d.data.activities.find(a=>a.id===activity);if(!record)throw Error('找不到活动');$('title').textContent=record.title;const j=await call('list');const columns=new Map((record.registration?.fields||[]).map(f=>[f.key,f.label]));for(const row of j.rows)for(const f of row.fields)if(!columns.has(f.key))columns.set(f.key,f.label+'（历史字段）');const table=$('table');table.replaceChildren();const tr=document.createElement('tr');for(const h of ['时间',...columns.values()]){const th=document.createElement('th');th.textContent=h;tr.append(th);}table.append(tr);for(const row of j.rows){const tr=document.createElement('tr');for(const value of [row.created,...[...columns.keys()].map(k=>row.answers[k])]){const td=document.createElement('td');td.textContent=text(value);tr.append(td);}table.append(tr);}$('message').textContent='共 '+j.rows.length+' 条报名';}catch(e){$('message').textContent=e.message;}}
$('refresh').onclick=load;
$('export').onclick=async()=>{try{const j=await call('export');const b=Uint8Array.from(atob(j.file),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download='报名名单.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}catch(e){$('message').textContent=e.message;}};
$('import').onclick=async()=>{const f=$('file').files[0];if(!f)return $('message').textContent='请先选择 .xlsx 文件';if(f.size>5*1024*1024)return $('message').textContent='文件不得超过 5MB';if(!confirm('校验后将导入报名记录，已有学号会跳过。继续？'))return;const button=$('import');button.disabled=true;try{const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));const j=await call('import',{file:btoa(s)});await load();$('message').textContent='新增 '+j.added+' 条，跳过重复 '+j.skipped+' 条';}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}};load();
</script></html>
